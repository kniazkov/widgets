server {
    listen 127.0.0.1:9443 ssl;
    server_name localhost;

    ssl_certificate     widgets-tls/fullchain.pem;
    ssl_certificate_key widgets-tls/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_cache off;
    }
}
