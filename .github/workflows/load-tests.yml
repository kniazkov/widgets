name: Load profiles

on:
  pull_request:
    paths:
      - scripts/build-test-fixture.sh
      - scripts/run-load.mjs
      - scripts/load/**
      - src/test/java/com/kniazkov/widgets/e2e/LoadTestServer.java
      - .github/workflows/load-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: load-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Build load fixture
        run: bash scripts/build-test-fixture.sh
      - name: Run repeated profiles and browser observer
        run: node scripts/run-load.mjs --browser --clients=1,100,1000 --repeats=2 --dom-samples=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-results
          path: target/load-results
          retention-days: 7
          if-no-files-found: ignore
