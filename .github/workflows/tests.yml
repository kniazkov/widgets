name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Java build and code style
        run: >-
          mvn --batch-mode --no-transfer-progress
          "-Dwidgets.tests.requireSymlinks=${{ matrix.os == 'ubuntu-latest' }}" verify

  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      # Keep Ubuntu package downloads independent of Canonical DNS outages.
      # APT still verifies packages with the runner's Ubuntu archive keyring.
      - name: Configure Ubuntu package mirror
        timeout-minutes: 1
        run: |
          test -f /etc/apt/apt-mirrors.txt
          for mirror_list in /etc/apt/apt-mirrors*.txt; do
            echo 'https://mirrors.edge.kernel.org/ubuntu/' | sudo tee "$mirror_list"
          done
          echo 'APT::Update::Error-Mode "any";' | sudo tee /etc/apt/apt.conf.d/99-ci-network
          echo 'Acquire::Retries "1";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-network
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-network
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-network
      - name: Install browser system dependencies
        timeout-minutes: 5
        run: npx playwright install-deps chromium webkit
      - name: Install Chromium and WebKit
        timeout-minutes: 5
        run: npx playwright install chromium webkit
      - name: Run browser tests
        run: npm run test:browser
