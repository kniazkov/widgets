name: Diagnostic WebKit form resize

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      # Keep the hosted runner's Ubuntu sources, mirror lists and archive keyring.
      - name: Bound APT network retries
        timeout-minutes: 1
        run: |
          echo 'APT::Update::Error-Mode "any";' | sudo tee /etc/apt/apt.conf.d/99-ci-network
          echo 'Acquire::Retries "1";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-network
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-network
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-network
      - name: Install browser system dependencies
        timeout-minutes: 5
        run: npx playwright install-deps chromium webkit
      - name: Install Chromium and WebKit
        timeout-minutes: 5
        run: npx playwright install chromium webkit
      - name: Run browser tests
        run: node scripts/run-e2e.mjs --retries=0
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-form-resize-${{ github.run_attempt }}
          path: |
            target/playwright-results
            target/playwright-report
          retention-days: 7
          if-no-files-found: warn
