name: Stream adapter
on:
  pull_request:
    paths:
      - scripts/run-stream-probe.mjs
      - src/main/java/com/kniazkov/widgets/base/**
      - pom.xml
      - src/test/java/com/kniazkov/widgets/e2e/StreamTestServer.java
      - .github/workflows/stream-probe.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stream-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Build shared Java fixture
        run: mvn -B -ntp -DskipTests test-compile dependency:build-classpath -Dmdep.outputFile=target/runtime-classpath.txt
      - name: Verify native Java WSS behind a TLS reverse proxy
        run: node scripts/run-stream-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stream-probe
          path: |
            target/stream-probe/report.json
            target/stream-probe/server.log
            target/stream-probe/metrics.json
          retention-days: 7
