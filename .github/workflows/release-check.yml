name: Release candidate
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build and install candidate from clean checkout
        run: mvn -B -ntp clean install
      - name: Compile independent Maven consumer
        run: mvn -B -ntp -f src/test/consumer/pom.xml clean verify
      - name: Validate release, resources and consumer
        run: node scripts/check-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-candidate
          path: |
            target/widgets-*.jar
            target/release-verification.json
          if-no-files-found: error
          retention-days: 7
